name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: |
          python -m compileall \
            baselines \
            data \
            evaluation \
            experiments \
            models \
            scripts \
            training

      - name: Run tests when present
        run: |
          if [ -d tests ]; then
            python -m pip install --upgrade pip
            python -m pip install pytest
            python -m pytest
          else
            echo "No tests directory present; compile check completed."
          fi
